<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Malak · Review desk</title><link rel="stylesheet" href="/admin/style.css"><script src="/admin/app.js" defer></script></head><body><header><div><span class="mark">M</span><strong>MALAK</strong><span class="muted">Review desk</span></div><button id="logout" hidden>Sign out</button></header><main><section id="login" class="login"><span class="eyebrow">ADMINISTRATOR ACCESS</span><h1>Your property review desk.</h1><p class="muted">Review customer documents and decide what goes live.</p><form id="loginForm"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Sign in</button></form></section><section id="workspace" hidden><div class="heading"><div><span class="eyebrow">CUSTOMER SUBMISSIONS</span><h1>Review queue</h1></div><button id="refresh">Refresh</button></div><div class="layout"><aside><label>Status<select id="filter"><option value="">All submissions</option><option>PENDING_REVIEW</option><option>CHANGES_REQUESTED</option><option>PUBLISHED</option><option>REJECTED</option><option>PAUSED</option></select></label><div id="queue"></div></aside><article id="detail"><p class="muted">Select a submission to review.</p></article></div></section><p id="message" role="status"></p></main></body></html>
