name: Foundation Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'db/**'
      - '.github/workflows/foundation.yml'
      - 'scripts/validate_repository.py'
      - 'docs/VERIFICATION.md'
      - 'docs/ARCHITECTURE.md'
  push:
    branches: [main]
    paths:
      - 'db/**'
      - '.github/workflows/foundation.yml'
      - 'scripts/validate_repository.py'
      - 'docs/VERIFICATION.md'
      - 'docs/ARCHITECTURE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-schema:
    name: Docs, workflow policy and PostGIS publication gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_USER: sell_ci
          POSTGRES_PASSWORD: sell_ci_disposable
          POSTGRES_DB: sell_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sell_ci -d sell_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate public repository workflow policy
        run: python3 scripts/validate_repository.py
      - name: Apply schema and exercise verification gate (synthetic fixtures)
        env:
          PGPASSWORD: sell_ci_disposable
        run: |
          set -euo pipefail
          # The already-running disposable PostGIS service includes psql.
          # Use it instead of downloading a second client from Ubuntu APT.
          # GitHub job.services.postgres.id is assigned by the hosted runner.
          postgres_service="${{ job.services.postgres.id }}"
          test -n "$postgres_service"
          for sql_file in \
            db/migrations/0001_foundation.sql \
            db/tests/0001_publication_gate.sql \
            db/migrations/0002_individual_evidence.sql \
            db/tests/0002_individual_evidence.test.sql \
            db/migrations/0003_private_evidence_http.sql \
            db/migrations/0004_private_ocr_route.sql \
            db/migrations/0005_private_pair_route.sql \
            db/migrations/0006_private_owner_case_intents.sql \
            db/migrations/0007_private_owner_http_routes.sql \
            db/migrations/0008_pilot_same_service_login.sql; do
            test -f "$sql_file"
            docker exec -i -e PGPASSWORD="$PGPASSWORD" "$postgres_service" \
              psql -h 127.0.0.1 -U sell_ci -d sell_ci \
                -X -v ON_ERROR_STOP=1 -f - < "$sql_file"
          done
      - name: Test actual Node evidence repository against disposable PostgreSQL
        env:
          PGPASSWORD: sell_ci_disposable
          MALAK_DISPOSABLE_PG: 'yes'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/malak-pg"
          npm --prefix "$RUNNER_TEMP/malak-pg" install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund pg@8.16.3
          node --experimental-strip-types --test services/verification/ci/postgres-live.integration.ts
      - name: Verify authenticated owner-case replay and consent withdrawal in disposable PostGIS
        env:
          PGPASSWORD: sell_ci_disposable
          MALAK_DISPOSABLE_PG: 'yes'
        run: |
          set -euo pipefail
          node --experimental-strip-types --test services/verification/ci/owner-case-live.integration.ts
      - name: Verify pilot 1234 session and cross-user case isolation (disposable PostgreSQL)
        env:
          PGPASSWORD: sell_ci_disposable
          MALAK_DISPOSABLE_PG: 'yes'
        run: |
          set -euo pipefail
          node --experimental-strip-types --test services/verification/ci/pilot-auth-live.integration.ts
      - name: Verify real PostgreSQL reviewer-only evidence access and immutable audit
        env:
          PGPASSWORD: sell_ci_disposable
          MALAK_DISPOSABLE_PG: 'yes'
        run: |
          set -euo pipefail
          node --experimental-strip-types --test services/verification/ci/reviewer-live.integration.ts
      - name: Verify real atomic private-request throttling and denial audit (disposable PostgreSQL)
        env:
          PGPASSWORD: sell_ci_disposable
          MALAK_DISPOSABLE_PG: 'yes'
        run: |
          set -euo pipefail
          node --experimental-strip-types --test services/verification/ci/private-http-live.integration.ts
