name: Malak Android real seller navigation smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-seller-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-seller:
    name: Tap Add Land on disposable Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Build exact source and verify consumer brand
        run: |
          python3 scripts/check_malak_brand.py
          gradle -p apps/android :app:assembleDebug --no-daemon
      - name: Enable KVM on disposable GitHub-hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch emulator and actually tap Add Land
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          script: |
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            python3 apps/android/scripts/seller-smoke.py
      - name: Keep synthetic-only screenshot on success/failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malak-seller-smoke-synthetic-screenshot
          path: /tmp/malak-android-seller-smoke/seller-open.png
          retention-days: 2
          if-no-files-found: ignore
