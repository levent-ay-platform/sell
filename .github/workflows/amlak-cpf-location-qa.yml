name: Amlak CPF location and Android QA
on:
  pull_request:
    paths:
      - 'services/verification/src/**'
      - 'services/verification/qa/**'
      - 'services/verification/test/**'
      - 'apps/android/**'
      - 'scripts/build-mac-cpf-bundle.py'
      - '.github/workflows/amlak-cpf-location-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test services/verification/test/*.test.ts
  isolated-cpf-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/build-mac-cpf-bundle.py --output qa/cpf-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: amlak-cpf-isolated-source
          path: qa/cpf-bundle/
          retention-days: 5
          if-no-files-found: error
  private-http-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -r services/verification/qa/requirements-runtime.txt
      - name: Install pinned image decoding dependencies for synthetic OCR tests
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 opencv-python-headless==4.12.0.88
      - name: Local HTTP and cache regression tests (synthetic only)
        env:
          PYTHONPATH: services/verification/qa
        run: python -m unittest -v test_mac_pilot_ocr_http test_workflow_http test_mac_pair_runtime
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/prepare_amlak_admin_sectors.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - run: |
          gradle -p apps/android :app:testDebugUnitTest :app:assembleDebug -PmalakV2Discovery=true -PmalakPrivateBaseUrl=https://malak-api.ayasofia.shop -PmalakPublicListingsBaseUrl=https://malak-api.ayasofia.shop -PmalakDirectPublishing=false --no-daemon
          mkdir -p qa
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk qa/Amlak-CPF-Location-Pilot.apk
          sha256sum qa/Amlak-CPF-Location-Pilot.apk > qa/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: amlak-cpf-location-pilot
          path: qa/
          retention-days: 5
          if-no-files-found: error
