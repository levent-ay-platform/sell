name: Amlak CPF location and Android QA
on:
  pull_request:
    paths:
      - 'services/verification/src/document-family-fields-v2.ts'
      - 'services/verification/qa/compare_mac_pair.mjs'
      - 'services/verification/test/document-family-fields-v2.test.ts'
      - 'apps/android/**'
      - '.github/workflows/amlak-cpf-location-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test services/verification/test/*.test.ts
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/prepare_amlak_admin_sectors.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - run: |
          gradle -p apps/android :app:testDebugUnitTest :app:assembleDebug -PmalakV2Discovery=true -PmalakPrivateBaseUrl=https://malak-api.ayasofia.shop -PmalakPublicListingsBaseUrl=https://malak-api.ayasofia.shop -PmalakDirectPublishing=false --no-daemon
          mkdir -p qa
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk qa/Amlak-CPF-Location-Pilot.apk
          sha256sum qa/Amlak-CPF-Location-Pilot.apk > qa/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: amlak-cpf-location-pilot
          path: qa/
          retention-days: 5
          if-no-files-found: error
