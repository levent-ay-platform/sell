name: Amlak P0 isolated Android UI acceptance

on:
  pull_request:
    branches: [codex/malak-pilot-complete, main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/amlak-p0-ui-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amlak-p0-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-feed-ui:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'codex/malak-v2-map-parcel-foundation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Enable KVM for the hosted emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Run offline fixture UI test (no production API or publishing)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot'
          script: |
            set +e
            gradle -p apps/android :app:connectedDebugAndroidTest -PmalakV2Discovery=true '-Pandroid.testInstrumentationRunnerArguments.class=tn.malak.app.PublicFeedAreaOnlyUiTest' --no-daemon
            result=$?
            mkdir -p qa-public-feed-ui
            adb pull /sdcard/Android/data/tn.malak.app/files/p0-public-feed-fr.png qa-public-feed-ui/ || true
            exit "$result"
      - name: Publish screenshots and test reports (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amlak-public-feed-ui-${{ github.sha }}
          path: |
            qa-public-feed-ui/**
            apps/android/app/build/reports/androidTests/connected/**
            apps/android/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 3
