name: Amlak isolated open Pilot APK
on:
  push:
    branches: [qa/amlak-open-pilot-endpoint-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connected-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare pinned public administrative sectors
        run: python3 scripts/prepare_amlak_admin_sectors.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Build connected pilot with separate proposed QA origin
        run: |
          python3 scripts/check_malak_brand.py
          python3 scripts/check_amlak_ui_contrast.py
          gradle -p apps/android :app:testDebugUnitTest :app:assembleDebug -PmalakV2Discovery=true -PmalakPrivateBaseUrl=https://malak-pilot.ayasofia.shop -PmalakPublicListingsBaseUrl=https://malak-pilot.ayasofia.shop -PmalakDirectPublishing=true --no-daemon
          mkdir -p qa
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk qa/Amlak-Full-Open-Pilot.apk
          test "$(stat -c %s qa/Amlak-Full-Open-Pilot.apk)" -le 60000000
          sha256sum qa/Amlak-Full-Open-Pilot.apk > qa/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: amlak-full-open-pilot-apk
          path: qa/
          retention-days: 5
          if-no-files-found: error
