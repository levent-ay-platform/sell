name: Amlak full offline release gate
on:
  push:
    branches: [qa/amlak-integrated-release-20261124, fix/amlak-cpf-property-location-20261124]
  pull_request:
    paths: ['.github/workflows/amlak-full-release-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connected-apk:
    if: github.event_name != 'pull_request' || github.head_ref == 'qa/amlak-integrated-release-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare pinned public administrative sectors
        run: python3 scripts/prepare_amlak_admin_sectors.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Build connected pilot with existing approved origin
        run: |
          python3 scripts/check_malak_brand.py
          python3 scripts/check_amlak_ui_contrast.py
          gradle -p apps/android :app:testDebugUnitTest :app:assembleDebug -PmalakV2Discovery=true -PmalakPrivateBaseUrl=https://malak-api.ayasofia.shop -PmalakPublicListingsBaseUrl=https://malak-api.ayasofia.shop -PmalakDirectPublishing=false --no-daemon
          mkdir -p qa
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk qa/Amlak-Unified-Intake-Pilot.apk
          test "$(stat -c %s qa/Amlak-Unified-Intake-Pilot.apk)" -le 60000000
          sha256sum qa/Amlak-Unified-Intake-Pilot.apk > qa/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: amlak-full-gate-connected-qa
          path: qa/
          retention-days: 5
          if-no-files-found: error
  offline-intake-ui:
    if: github.event_name != 'pull_request' || github.head_ref == 'qa/amlak-integrated-release-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare pinned public administrative sectors
        run: python3 scripts/prepare_amlak_admin_sectors.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test all offline UI classes, no live personal documents
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot'
          script: gradle -p apps/android :app:connectedDebugAndroidTest -PmalakV2Discovery=true -Pandroid.testInstrumentationRunnerArguments.class=tn.malak.app.AtlasAdminAssetTest,tn.malak.app.BuyerDiscoveryTest,tn.malak.app.DocumentAreaJourneyTest,tn.malak.app.IndustrialMapTest,tn.malak.app.LightThemeContrastTest,tn.malak.app.MapCatalogFeedbackTest,tn.malak.app.MapHomeTest,tn.malak.app.NozhaPublicCardContractTest,tn.malak.app.OwnerBoundaryDraftStoreTest,tn.malak.app.PublicFeedAreaOnlyUiTest,tn.malak.app.StartupThemeTest,tn.malak.app.UnifiedIntakeUiTest,tn.malak.app.PrivatePlanRestoreTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amlak-full-offline-ui-results
          path: apps/android/app/build/outputs/androidTest-results/connected/
          retention-days: 5
          if-no-files-found: warn
