name: Amlak connected authentication QA APK

on:
  pull_request:
    branches: [codex/malak-pilot-complete, main]
    paths:
      - '.github/workflows/amlak-login-qa.yml'
      - 'apps/android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connected-login-debug:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'codex/malak-v2-map-parcel-foundation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Assemble debug with selected approved HTTPS endpoints
        run: |
          set -euo pipefail
          gradle -p apps/android :app:testDebugUnitTest :app:assembleDebug -PmalakV2Discovery=true -PmalakPrivateBaseUrl=https://malak-api.ayasofia.shop -PmalakPublicListingsBaseUrl=https://malak-api.ayasofia.shop -PmalakDirectPublishing=false --no-daemon
          test "$(stat -c %s apps/android/app/build/outputs/apk/debug/app-debug.apk)" -le 60000000
      - uses: actions/upload-artifact@v4
        with:
          name: amlak-connected-auth-qa-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5
          if-no-files-found: error
