name: Amlak private review attachment QA
on:
  push:
    branches: [feat/amlak-private-plan-attachments-20261124]
  pull_request:
    paths: ['services/verification/qa/**', '.github/workflows/amlak-private-attachments.yml']
permissions:
  contents: read
jobs:
  private-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/verification/qa/requirements-runtime.txt
      - run: python -m unittest -v test_review_attachments test_pilot_workflow test_workflow_http test_public_pilot_projection
        working-directory: services/verification/qa
        env:
          MALAK_DIRECT_PUBLISHING: '0'
