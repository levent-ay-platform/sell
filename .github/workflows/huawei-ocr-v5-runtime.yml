name: Malak Huawei v5 isolated runtime acceptance (public model only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/verification/ocr/cin_v5.py'
      - 'services/verification/ocr/cin_v5_vote.py'
      - 'services/verification/ocr/cin_v5_socket.py'
      - 'services/verification/docker/HuaweiCinV5.Dockerfile'
      - 'services/verification/scripts/install-huawei-v5-canary.sh'
      - '.github/workflows/huawei-ocr-v5-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malak-huawei-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-cpu-runtime:
    name: Huawei v5 container CPU / offline inference (synthetic-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate explicit Huawei installation script, no install in CI
        run: |
          set -euo pipefail
          bash -n services/verification/scripts/install-huawei-v5-canary.sh
          MALAK_EXPECT_HEAD="$(git rev-parse HEAD)" \
            bash services/verification/scripts/install-huawei-v5-canary.sh --preflight
      - name: Build isolated runtime with SHA256-pinned PUBLIC OCR weights only
        run: |
          set -euo pipefail
          docker build -f services/verification/docker/HuaweiCinV5.Dockerfile \
            -t malak-huawei-v5:synthetic-qa .
      - name: Offline unprivileged CPU and RAM bounded model inference
        run: |
          set -euo pipefail
          response="$(docker run --rm \
            --network none --read-only --user 10001:10001 \
            --security-opt no-new-privileges --cap-drop ALL \
            --pids-limit 64 --cpus 1 --memory 768m --memory-swap 768m \
            --tmpfs /work:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700,size=33554432 \
            malak-huawei-v5:synthetic-qa --self-test)"
          test "$response" = '{"ok":true,"engine":"arabic-v5","modelReady":true}'
          echo 'PASS: OFFLINE public v5 ONNX model, no real image, limited CPU/RAM, no network'
      - name: Exercise warm Unix socket with TWO synthetic images, without network
        run: |
          set -euo pipefail
          docker run -d --name malak-warm-v5-test \
            --network none --read-only --user 10001:10001 \
            --security-opt no-new-privileges --cap-drop ALL \
            --pids-limit 64 --cpus 1 --memory 768m --memory-swap 768m \
            --tmpfs /work:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700,size=33554432 \
            --tmpfs /run/malak-ocr:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700,size=1048576 \
            malak-huawei-v5:synthetic-qa --serve >/dev/null
          trap 'docker rm -f malak-warm-v5-test >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 20); do
            if docker exec malak-warm-v5-test test -S /run/malak-ocr/ocr-v5.sock; then
              ready=1; break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec -i malak-warm-v5-test python -E -s - <<'PY'
          import json, socket, struct
          import cv2, numpy as np
          frame=np.full((760,1200,3),255,dtype=np.uint8)
          success,buf=cv2.imencode('.png',frame)
          assert success
          data=buf.tobytes()
          def read_exact(s,n):
              result=bytearray()
              while len(result)<n:
                  part=s.recv(n-len(result))
                  if not part: raise AssertionError('early socket close')
                  result.extend(part)
              return bytes(result)
          for _ in range(2):
              with socket.socket(socket.AF_UNIX,socket.SOCK_STREAM) as client:
                  client.settimeout(15)
                  client.connect('/run/malak-ocr/ocr-v5.sock')
                  client.sendall(struct.pack('>IB',len(data),2)+data)
                  length=struct.unpack('>I',read_exact(client,4))[0]
                  assert 12<=length<=4096
                  response=json.loads(read_exact(client,length))
                  assert response['ok'] is True
                  assert response['surname'] is None
                  assert response['givenName'] is None
                  assert response['confidencePercent']==0
          print('PASS: two offline AF_UNIX synthetic requests, one warm model, no PII')
          PY
      - name: Check never upload model or personal evidence artifacts
        run: |
          set -euo pipefail
          ! find . -type f \( -name '*.onnx' -o -name '*.traineddata' -o -iname '*cin-sample*' \) \
            -not -path './.git/*' -print -quit | grep -q .
