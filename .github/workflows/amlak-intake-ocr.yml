name: Amlak intake OCR regression (synthetic only)
on:
  push:
    branches: [feat/amlak-unified-intake-20261124, fix/amlak-cpf-property-location-20261124]
  pull_request:
    paths: ['services/verification/ocr/**', 'services/verification/qa/**', '.github/workflows/amlak-intake-ocr.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  birth-date:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "numpy==1.26.4" "opencv-python-headless==4.10.0.84" "onnxruntime==1.23.2" "PyYAML==6.0.2"
      - run: python -m unittest test_cin_mac_date test_cin_v5_date test_cin_partial_fields test_cin_mac_identity -v
        working-directory: services/verification/ocr

      - run: python -m unittest test_pilot_card_retry test_mac_pilot_ocr_http -v
        working-directory: services/verification/qa
