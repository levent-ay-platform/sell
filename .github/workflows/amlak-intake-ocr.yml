name: Amlak intake OCR regression (synthetic only)
on:
  push:
    branches: [feat/amlak-unified-intake-20261124]
    paths: ['services/verification/ocr/**', '.github/workflows/amlak-intake-ocr.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  birth-date:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy opencv-python-headless
      - run: python -m unittest test_cin_mac_date test_cin_v5_date -v
        working-directory: services/verification/ocr
