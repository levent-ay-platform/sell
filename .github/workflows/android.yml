name: Malak Android (hosted Ubuntu)

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
      - 'scripts/check_malak_brand.py'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
      - 'scripts/check_malak_brand.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-preview:
    name: Android debug APK — GitHub-hosted Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check approved brand
        run: python3 scripts/check_malak_brand.py
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK (no removed legacy tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Configure Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Assemble synthetic QA Android APK
        run: gradle -p apps/android :app:assembleDebug --no-daemon --stacktrace
      - name: Upload QA APK (no signing keys, no personal data)
        uses: actions/upload-artifact@v4
        with:
          name: malak-PROTOTYPE-NOT-VISUALLY-APPROVED-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error
      - name: Enable KVM for visual QA
        if: github.event_name == 'pull_request'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual Android home at 360dp and 412dp
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p screenshots
            adb shell wm size 720x1600
            adb shell wm density 320
            adb shell am force-stop tn.malak.app || true
            adb shell am start -n tn.malak.app/.MainActivity
            sleep 6
            adb exec-out screencap -p > screenshots/home-360dp.png
            # Drag on the map photo, away from cards/tools; this must collapse UI chrome.
            adb shell input swipe 215 715 395 625 420
            sleep 2
            adb exec-out screencap -p > screenshots/map-immersive-360dp.png
            adb shell wm size 824x1830
            adb shell wm density 320
            adb shell am force-stop tn.malak.app || true
            adb shell am start -n tn.malak.app/.MainActivity
            sleep 6
            adb exec-out screencap -p > screenshots/home-412dp.png
            adb shell input swipe 245 830 460 720 420
            sleep 2
            adb exec-out screencap -p > screenshots/map-immersive-412dp.png
            test $(wc -c < screenshots/map-immersive-360dp.png) -gt 10000
            test $(wc -c < screenshots/map-immersive-412dp.png) -gt 10000
            test $(wc -c < screenshots/home-360dp.png) -gt 10000
            test $(wc -c < screenshots/home-412dp.png) -gt 10000
      - name: Upload Android visual proof (review before acceptance)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: malak-ANDROID-SCREENSHOT-UNREVIEWED-${{ github.sha }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 7
