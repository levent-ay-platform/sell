name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Search indexed official gazette archive by exact land title, parent and locality (read only)
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,urllib.error,json,time,concurrent.futures,os,re
          os.makedirs("target_title_independent_search",exist_ok=True)
          queries=["555941","504219","42910","M'Rada","M'rada et Ferjane","Mrada","Ferjane","Khemis","Khmis"]
          base="https://api.jort.tn/search"
          def query(q):
           args={"q":q,"limit":15,"sort":"relevance"}
           u=base+"?"+urllib.parse.urlencode(args)
           t=time.monotonic()
           try:
            req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 Malak land registry contextual public research","Accept":"application/json"})
            with urllib.request.urlopen(req,timeout=18) as r:
             b=r.read(180000);ct=r.headers.get("Content-Type");code=r.status
            j=json.loads(b)
            results=[]
            for x in j.get("results",[]):
             s=re.sub(r'<[^>]+>'," ",str(x.get("snippet") or ""))
             results.append({"collection":x.get("collection"),"year":x.get("year"),"issue":x.get("issue"),"page":x.get("page"),"pdf_url":x.get("pdf_url"),"snippet":s[:400]})
            res={"query":q,"total":j.get("total"),"results":results,"http":code,"elapsed":round(time.monotonic()-t,2),"error":j.get("error")}
            print("SEARCH",json.dumps(res,ensure_ascii=False)[:6500],flush=True)
            return res
           except Exception as e:
            res={"query":q,"error":type(e).__name__+":"+str(e)[:160],"elapsed":round(time.monotonic()-t,2)}
            print("SEARCH",json.dumps(res,ensure_ascii=False),flush=True)
            return res
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:res=list(pool.map(query,queries))
          with open("target_title_independent_search/jort_full_text_matches.json","w",encoding="utf8") as w:json.dump(res,w,ensure_ascii=False,indent=2)
          print("SUMMARY",json.dumps({"exact_title_555941_matches":next((x.get("total") for x in res if x["query"]=="555941"),None),"parent_504219_matches":next((x.get("total") for x in res if x["query"]=="504219"),None),"sources_checked":"JORT French currently only per docs.jort.tn","status":"negative search must not be treated as absence from Arabic records"},ensure_ascii=False),flush=True)

          PYCODE
      - name: Archive search results and exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: malak-title555941-jort-independent-crosscheck
          path: target_title_independent_search/
          retention-days: 7
