name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Export 3 Nabeul urban planning scanned map samples via public API
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,urllib.error,json,time,math,concurrent.futures
          ROOT="https://geopau.gov.tn/arcgisserver/rest/services/public/SCANs_public/MapServer"
          L=[("Beni_Khaled",157),("Kelibia",155701),("Korba",168)]
          def process(item):
           name,lid=item
           t=time.monotonic()
           try:
            meta_url=f"{ROOT}/{lid}?f=json"
            with urllib.request.urlopen(urllib.request.Request(meta_url,headers={"User-Agent":"Mozilla/5.0 MalakGISReadOnly"}),timeout=30) as r:d=json.loads(r.read(120000))
            ext=d.get("extent")
            if not ext:return {"name":name,"error":"no_extent","meta":str(d)[:250]}
            bbox=",".join(str(ext[k]) for k in ["xmin","ymin","xmax","ymax"])
            p={"bbox":bbox,"bboxSR":3857,"imageSR":3857,"size":"450,450","dpi":72,"format":"jpg","transparent":"false","layers":"show:"+str(lid),"f":"json"}
            url=ROOT+"/export?"+urllib.parse.urlencode(p)
            print("EXPORT_REQUEST",name,lid,"url",url,"flush",True,flush=True)
            try:
             with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"}),timeout=95) as r:
              payload=r.read(300000)
              status=r.status
             obj=json.loads(payload)
             return {"name":name,"status":status,"seconds":round(time.monotonic()-t,1),"extent":ext,"export":obj}
            except Exception as e:return {"name":name,"error":type(e).__name__+":"+str(e)[:140],"seconds":round(time.monotonic()-t,1),"bbox":bbox}
           except Exception as e:return {"name":name,"error":"meta "+type(e).__name__+":"+str(e)[:140]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
           for a in ex.map(process,L):print("EXPORT_RESULT",json.dumps(a,ensure_ascii=False),flush=True)

          PYCODE
