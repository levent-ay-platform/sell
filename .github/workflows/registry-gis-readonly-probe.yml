name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve GeoPAU public Web App map item and actual configured layers
        run: |
          python3 - <<'PYCODE'
          import urllib.request,json,time
          url="https://geopau.gov.tn/app_sig_pau_tunisie_public/config.json"
          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=25) as r:j=json.load(r)
          for k in ("portalUrl","appId","map","geometryService","httpProxy","dataSource"):
           print("SETTING",k,json.dumps(j.get(k),ensure_ascii=False)[:3000],flush=True)
          for col in ("widgetOnScreen","widgetPool"):
           w=j.get(col,{})
           print("WIDGET_COLLECTION",col,json.dumps([{"uri":x.get("uri"),"name":x.get("name"),"config":x.get("config")} for x in w.get("widgets",[]) if any(y in str(x).lower() for y in ("search","layer","attribute","query","filter"))],ensure_ascii=False)[:3000],flush=True)
          item=(j.get("map") or {}).get("itemId") or (j.get("map") or {}).get("id")
          portal=j.get("portalUrl","https://www.arcgis.com")
          if item:
           import urllib.parse
           candidates=[portal.rstrip("/")+"/sharing/rest/content/items/"+str(item)+"/data?f=json",portal.rstrip("/")+"/sharing/rest/content/items/"+str(item)+"?f=json"]
           for u in candidates:
            try:
             with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=25) as r:
              q=json.load(r)
             print("WEBMAP_ITEM",u,"keys",list(q)[:15],"layers",json.dumps(q.get("operationalLayers",[]),ensure_ascii=False)[:8000],flush=True)
            except Exception as e:print("WEBMAP_ERROR",str(e)[:120],flush=True)

          PYCODE
