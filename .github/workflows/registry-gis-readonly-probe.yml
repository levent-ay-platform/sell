name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify PAUs vector schema and lightweight zone query endpoints
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,urllib.error,json,time,concurrent.futures,collections,os
          base="https://geopau.gov.tn/arcgisserver/rest/services/public/PAUs_public/MapServer"
          def fetch(tag,url,params=None,timeout=17):
            u=url+(("?"+urllib.parse.urlencode(params)) if params else "")
            start=time.monotonic()
            try:
              with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 (Malak read-only vector audit)","Accept":"application/json"}),timeout=timeout) as r:
                data=r.read(1600000);type_=r.headers.get("content-type");code=r.status
              result=json.loads(data)
              print("HTTP",json.dumps({"label":tag,"status":code,"bytes":len(data),"type":type_,"elapsed":round(time.monotonic()-start,1),"error":result.get("error"),"keys":list(result.keys())[:15],"features":len(result.get("features",[])) if isinstance(result.get("features"),list) else None,"objectIds_count":len(result.get("objectIds",[])) if isinstance(result.get("objectIds"),list) else None,"sample_feature":result.get("features",[None])[0] if result.get("features") else None},ensure_ascii=False)[:4500],flush=True)
              return result
            except Exception as e:
              print("ERROR",json.dumps({"label":tag,"exception":type(e).__name__,"details":str(e)[:120],"elapsed":round(time.monotonic()-start,1)},ensure_ascii=False),flush=True)
          j=fetch("full_vector_metadata",base+"/layers",{"f":"pjson"},timeout=50)
          if j:
            layers=j.get("layers",[]);print("LAYER_COUNTS",json.dumps(dict(collections.Counter(l.get("type") for l in layers)),ensure_ascii=False),flush=True)
            summary={"source":base+"/layers?f=pjson","query_api_status":"unverified","layers":[]}
            for l in layers:
              fields=l.get("fields") or []
              summary["layers"].append({"id":l.get("id"),"name":l.get("name"),"type":l.get("type"),"geometryType":l.get("geometryType"),"parent":(l.get("parentLayer") or {}).get("name"),"fields":[f.get("name") for f in fields]})
            for id in (60,138,69,4,66):
              x=next((l for l in layers if l.get("id")==id),{})
              fields=x.get("fields") or []
              keys=("Code","Vocation","Type","PAU_ID","Zone_id","Libelle","Nom","Intitule","Shape.STArea()")
              interesting=[{"name":f["name"],"domain_count":len((f.get("domain") or {}).get("codedValues",[])),"first_domains":(f.get("domain") or {}).get("codedValues",[])[:8]} for f in fields if f.get("name") in keys]
              print("LAYER_METADATA",json.dumps({"id":id,"name":x.get("name"),"type":x.get("type"),"geometry":x.get("geometryType"),"fields":[f.get("name") for f in fields],"selected":interesting},ensure_ascii=False)[:4600],flush=True)
            with open("GeoPAU_PAUs_public_Vector_Schema_20261114.json","w",encoding="utf-8") as out:json.dump(summary,out,ensure_ascii=False,indent=2)
          else:print("VECTOR_SCHEMA_UNAVAILABLE",flush=True)
          cases=[
            ("zones_60_empty",60,{"where":"1=0","outFields":"OBJECTID","returnGeometry":"false","f":"json"}),
            ("zones_138_point",138,{"where":"1=1","geometry":"11.090,36.843","geometryType":"esriGeometryPoint","inSR":"4326","spatialRel":"esriSpatialRelIntersects","outFields":"OBJECTID,Code,Vocation,PAU_ID","returnGeometry":"false","resultRecordCount":"1","f":"json"}),
            ("zones_60_point",60,{"where":"1=1","geometry":"11.090,36.843","geometryType":"esriGeometryPoint","inSR":"4326","spatialRel":"esriSpatialRelIntersects","outFields":"OBJECTID,Code,Vocation,PAU_ID","returnGeometry":"false","resultRecordCount":"1","f":"json"})
          ]
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
            futs=[pool.submit(fetch,tag,base+"/"+str(id)+"/query",params) for tag,id,params in cases]
            for f in futs:f.result()

          PYCODE
      - name: Archive verified public vector GIS layer schema
        uses: actions/upload-artifact@v4
        with:
          name: geopau-vector-layer-schema-public
          path: GeoPAU_PAUs_public_Vector_Schema_20261114.json
          retention-days: 7
          if-no-files-found: ignore
