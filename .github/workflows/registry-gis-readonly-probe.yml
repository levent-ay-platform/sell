name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Public GET requests only; no cookies or credentials
        run: |
          python3 - <<'PYCODE'
          import urllib.request, urllib.error, urllib.parse, json, re, time
          B="https://geopau.gov.tn/arcgisserver/rest/services"
          U={
           "cpf_title":"https://www.cpf.gov.tn/CPFWebSite/Arabe/DescriptionTitre.php?nt=555941&gt=4&dt=0",
           "otc_renseignements":"https://www.otc.nat.tn/Renseignements",
           "gis_root":B+"?f=json",
           "gis_public":B+"/public?f=json",
           "gis_pau":B+"/pau?f=json",
           "gis_pau_layers":B+"/public/PAUs_public/MapServer/layers?f=json",
           "gis_scans_layers":B+"/public/SCANs_public/MapServer/layers?f=json",
           "gis_limites_layers":B+"/public/LimitesAdmin/FeatureServer/layers?f=json",
           "gis_find":B+"/public/PAUs_public/MapServer/find?"+urllib.parse.urlencode({"searchText":"555941","contains":"false","layers":"all","returnGeometry":"false","f":"json"})
          }
          keyword=re.compile("cadast|foncier|titre|title|parcel|parcell|immatric|matricul|registre|numero.?tf",re.I)
          for label,url in U.items():
           st=time.monotonic()
           try:
            req=urllib.request.Request(url,headers={"User-Agent":"MalakReadOnlyResearch/1.0","Accept":"application/json,text/html,*/*"})
            with urllib.request.urlopen(req,timeout=12) as r:
             raw=r.read(4500000);status=r.status;ctype=r.headers.get("Content-Type","")
            s=raw.decode("utf-8","replace")
            print("RESULT",label,status,ctype,"bytes",len(raw),"elapsed",round(time.monotonic()-st,1),flush=True)
            if label=="cpf_title":
             print("CPF_MARKERS",{k:k in s for k in ["555941","504219","متعامل به","الرسوم الأم","الرسوم المحدثة"]},flush=True)
            if "json" not in ctype and not s.lstrip().startswith("{"):continue
            try:d=json.loads(s)
            except Exception as e:print("PARSE_ERROR",label,str(e)[:100],flush=True);continue
            if label in ("gis_root","gis_public","gis_pau"):
             print("DIRECTORY",label,"folders",d.get("folders",[]),"services",[x.get("name") for x in d.get("services",[])],flush=True)
            if label.endswith("_layers"):
             ls=d.get("layers",[]);found=[]
             for layer in ls:
              fields=[x.get("name","") for x in layer.get("fields",[])]
              matches=[f for f in fields if keyword.search(f)]
              if keyword.search(layer.get("name","")) or matches:found.append({"layer":layer.get("name"),"id":layer.get("id"),"fields":matches})
             print("FIELD_AUDIT",label,"layer_count",len(ls),"cadastral_candidates",found[:60],flush=True)
            if label=="gis_find":
             res=d.get("results",[])
             print("FIND_555941", "count",len(res),"error",d.get("error"),"first_matches",[{"layer":x.get("layerName"),"field":x.get("foundFieldName"),"value":str(x.get("value"))[:40]} for x in res[:10]],flush=True)
           except urllib.error.HTTPError as e:print("HTTP_ERROR",label,e.code,"elapsed",round(time.monotonic()-st,1),flush=True)
           except Exception as e:print("ERROR",label,type(e).__name__,str(e)[:120],"elapsed",round(time.monotonic()-st,1),flush=True)

          PYCODE
