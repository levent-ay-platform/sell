name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify official INS code 156651 against ArcGIS sector field and basic query health
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,json,time,concurrent.futures
          root="https://geopau.gov.tn/arcgisserver/rest/services/public/PAUs_public/MapServer"
          requests=[
          ("COUNT_SECTEUR",4,{"where":"1=1","returnCountOnly":"true","f":"json"}),
          ("EXACT_SECT_ID",4,{"where":"Sect_id=156651","outFields":"Sect_id,Nom,Deleg_id","returnGeometry":"false","f":"json"}),
          ("EXACT_DELEG_ID",1,{"where":"Deleg_id=1566","outFields":"Deleg_id,Nom,Gouv_id","returnGeometry":"false","f":"json"}),
          ("OBJECTID_GOUV",0,{"objectIds":"1","outFields":"Gouv_id,Nom","returnGeometry":"false","f":"json"}),
          ("OBJECTID_SECT",4,{"objectIds":"1","outFields":"Sect_id,Nom,Deleg_id","returnGeometry":"false","f":"json"})]
          def run(x):
           name,lid,p=x;u=f"{root}/{lid}/query?"+urllib.parse.urlencode(p)
           t=time.monotonic()
           try:
            with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 MalakCheckJoin/1.0","Accept":"application/json"}),timeout=17) as r:
             raw=r.read(90000);status=r.status
            d=json.loads(raw)
            print("JOIN_PROBE",name,"http",status,"elapsed",round(time.monotonic()-t,1),"data",json.dumps({"count":d.get("count"),"features":[y.get("attributes") for y in d.get("features",[])[:5]],"error":d.get("error")},ensure_ascii=False),flush=True)
           except Exception as e:print("JOIN_PROBE_ERROR",name,type(e).__name__,str(e)[:120],"elapsed",round(time.monotonic()-t,1),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:list(ex.map(run,requests))

          PYCODE
