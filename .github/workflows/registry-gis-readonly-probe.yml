name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public PAU linked documents and filter ArcGIS portal catalog to issuing org
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,urllib.error,json,time,re,html,os
          os.makedirs("geopau_docs_and_portal",exist_ok=True)
          def read(label,url,timeout=16,save=False):
           st=time.monotonic()
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (Malak public GeoPAU evidence audit)","Accept":"text/html,application/json,image/png,*/*;q=0.2"}),timeout=timeout) as r:
             b=r.read(250000);code=r.status;ct=r.headers.get("content-type");final=r.url
            s=b.decode("utf8","replace")
            result={"test":label,"http":code,"bytes":len(b),"content_type":ct,"final_url":final,"elapsed":round(time.monotonic()-st,1)}
            try:
             j=json.loads(b);result["json_keys"]=list(j)[:15]
             result["id"]=j.get("id");result["owner"]=j.get("owner");result["orgId"]=j.get("orgId");result["title"]=j.get("title")
             if "results" in j:
              result["total"]=j.get("total")
              result["results"]=[{"id":x.get("id"),"title":x.get("title"),"owner":x.get("owner"),"type":x.get("type"),"url":x.get("url")} for x in j["results"][:22]]
             if save:
              with open("geopau_docs_and_portal/"+label+".json","w",encoding="utf8") as w:json.dump(j,w,ensure_ascii=False,indent=2)
            except Exception:
             result["body_head"]=s[:240] if "image" not in (ct or "") else "binary image"
             if "<html" in s.lower():
              result["directory_listing"]=bool(re.search("Index of|Directory Listing|Directory of|^<h1>.*docs|href=[\"']\\d+/?[\"']",s,re.I|re.M))
              result["hrefs"]=re.findall(r"href=[^ >]+",s,re.I)[:35]
              if save:
               with open("geopau_docs_and_portal/"+label+".html","w",encoding="utf8") as w:w.write(s)
            print("TEST",json.dumps(result,ensure_ascii=False)[:6500],flush=True)
            return result
           except urllib.error.HTTPError as e:
            result={"test":label,"http":e.code,"location":e.headers.get("Location"),"body_head":e.read(180).decode("utf8","replace"),"elapsed":round(time.monotonic()-st,1)}
           except Exception as e:result={"test":label,"error":type(e).__name__,"details":str(e)[:140],"elapsed":round(time.monotonic()-st,1)}
           print("TEST",json.dumps(result,ensure_ascii=False),flush=True)
           return result
          base="https://geopau.gov.tn/apps/docs/"
          read("docs_root",base,15,True)
          read("docs_folder_icon",base+"folder.png",12,False)
          read("docs_example_first_index",base+"1/",12,False)
          item="https://tunisia.maps.arcgis.com/sharing/rest/content/items/95503522a0474dd1ac8fc2a8d4368f02?f=json"
          it=read("official_webmap_item",item,15,True)
          org=it.get("orgId")
          if org:
           searches=[
           ("arcgis_org_pau",f"orgid:{org} AND PAU"),
           ("arcgis_org_cadastre",f"orgid:{org} AND (cadastre OR parcellaire OR lotissement)"),
           ("arcgis_org_geopau",f"orgid:{org} AND (urbanisme OR amenagement)")
           ]
           for label,q in searches:
            params=urllib.parse.urlencode({"f":"json","q":q,"num":"30","sortField":"modified","sortOrder":"desc"})
            read(label,"https://www.arcgis.com/sharing/rest/search?"+params,20,True)
          else:
           print("NO_ORG_ID: portal items previously returned broad global PAU results; do not treat as Tunisian official.",flush=True)

          PYCODE
      - name: Archive documents portal metadata results
        uses: actions/upload-artifact@v4
        with:
          name: geopau-doc-links-and-org-scoped-search
          path: geopau_docs_and_portal/
          retention-days: 7
          if-no-files-found: warn
