name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect remaining public service layer names (distinct metadata endpoints)
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.error,json,time,concurrent.futures,collections
          base="https://geopau.gov.tn/arcgisserver/rest/services/public"
          urls=[
          ("LimitesAdmin_FeatureServer",base+"/LimitesAdmin/FeatureServer?f=json"),
          ("OSM_FS_FeatureServer",base+"/OSM_FS/FeatureServer?f=json"),
          ("OSM_MapServer_layers",base+"/OSM/MapServer/layers?f=json"),
          ("VoiriesLeKram_MapServer_layers",base+"/VoiriesLeKram/MapServer/layers?f=json"),
          ("LimitesAdmin_MapServer",base+"/LimitesAdmin/MapServer?f=json")]
          def run(v):
           label,url=v;t=time.monotonic()
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"Mozilla/5.0 public read-only layer inventory"}),timeout=28) as r:raw=r.read(500000)
            j=json.loads(raw)
            a=j.get("layers",[])
            def summarise(x):
             return {"id":x.get("id"),"name":x.get("name"),"type":x.get("type"),"geometry":x.get("geometryType"),"fields":[f.get("name") for f in (x.get("fields") or [])][:25]}
            print("PUBLIC_SERVICE",json.dumps({"source":label,"elapsed":round(time.monotonic()-t,1),"error":j.get("error"),"count":len(a),"layers":[summarise(x) for x in a][:60]},ensure_ascii=False)[:14000],flush=True)
           except Exception as e:print("PUBLIC_SERVICE_ERROR",json.dumps({"source":label,"elapsed":round(time.monotonic()-t,1),"type":type(e).__name__,"error":str(e)[:180]},ensure_ascii=False),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:list(ex.map(run,urls))

          PYCODE
