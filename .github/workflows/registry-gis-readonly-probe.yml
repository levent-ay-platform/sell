name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare HTTP and HTTPS for direct PAU Data feature query
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.error,urllib.parse,json,time
          base="geopau.gov.tn/arcgisserver/rest/services/public/PAUs_public/MapServer"
          tests=[
          ("http_metadata","http://"+base+"/60?f=json"),
          ("http_query","http://"+base+"/60/query?where=OBJECTID%3D1&outFields=Zone_id%2CCode%2CVocation%2CPAU_ID&returnGeometry=false&f=json"),
          ("https_query_exact","https://"+base+"/60/query?where=OBJECTID%3D1&outFields=Zone_id%2CCode%2CVocation%2CPAU_ID&returnGeometry=false&f=json"),
          ("https_query_gov_0","https://"+base+"/0/query?where=OBJECTID%3D1&outFields=Nom&returnGeometry=false&f=json"),
          ]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args):return None
          for tag,url in tests:
           t=time.monotonic()
           try:
            with urllib.request.build_opener(NoRedirect()).open(urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"Mozilla/5.0"}),timeout=13) as r:body=r.read(10000);code=r.status;location=r.headers.get("Location")
            try:parsed=json.loads(body)
            except Exception:parsed={"raw_start":body.decode("utf8","replace")[:120]}
            print("DIFF",json.dumps({"tag":tag,"http":code,"location":location,"keys":list(parsed)[:10],"error":parsed.get("error"),"nfeatures":len(parsed.get("features",[])) if isinstance(parsed.get("features"),list) else None,"secs":round(time.monotonic()-t,1)},ensure_ascii=False),flush=True)
           except urllib.error.HTTPError as e:
            print("DIFF",json.dumps({"tag":tag,"http":e.code,"location":e.headers.get("Location"),"preview":e.read(150).decode("utf8","replace"),"secs":round(time.monotonic()-t,1)},ensure_ascii=False),flush=True)
           except Exception as e:
            print("DIFF",json.dumps({"tag":tag,"exception":type(e).__name__,"message":str(e)[:130],"secs":round(time.monotonic()-t,1)},ensure_ascii=False),flush=True)

          PYCODE
