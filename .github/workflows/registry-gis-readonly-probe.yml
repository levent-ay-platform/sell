name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query real Delegation Secteur and PAU localities against certificate
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,urllib.error,json,time,concurrent.futures,re
          root="https://geopau.gov.tn/arcgisserver/rest/services/public/PAUs_public/MapServer"
          jobs=[]
          for id in [0,1,2,4,69]:
           jobs.append(("META_"+str(id),f"{root}/{id}?f=json"))
          checks=[
           ("DELEG_HAMMAMET",1,"Nom LIKE '%Hammamet%'"),
           ("DELEG_HAMMAM_AR",1,"Nom LIKE '%حمامات%'"),
           ("SECT_MRADA",4,"Nom LIKE '%Mrada%'"),
           ("SECT_FERJ",4,"Nom LIKE '%Ferj%'"),
           ("SECT_MRAD",4,"Nom LIKE '%Mrad%'"),
           ("SECT_SIDI",4,"Nom LIKE '%Jedidi%'"),
           ("SECT_AR_MRAD",4,"Nom LIKE '%مرادة%'"),
           ("SECT_HAMMAM",4,"Nom LIKE '%Hammamet%'"),
           ("PAU_LIB_HAMMAM",69,"Libelle LIKE '%Hammamet%'"),
           ("PAU_LIB_MRADA",69,"Libelle LIKE '%Mrada%'")]
          for label,lid,where in checks:
           p={"f":"json","where":where,"outFields":"*","returnGeometry":"false","resultRecordCount":20}
           jobs.append((label,f"{root}/{lid}/query?"+urllib.parse.urlencode(p)))
          def get(item):
           k,u=item;t=time.monotonic()
           try:
            with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 MalakGeoPublicAudit/1.0","Accept":"application/json"}),timeout=21) as r:raw=r.read(450000);ct=r.headers.get("Content-Type")
            d=json.loads(raw);return k,d,{"bytes":len(raw),"type":ct,"secs":round(time.monotonic()-t,1)}
           except Exception as e:return k,{},{"error":type(e).__name__+":"+str(e)[:120],"secs":round(time.monotonic()-t,1)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
           for key,d,info in ex.map(get,jobs):
            if key.startswith("META_"):
             print("LAYER_META",key,json.dumps({"status":info,"name":d.get("name"),"type":d.get("type"),"geometry":d.get("geometryType"),"fields":[{"n":z.get("name"),"a":z.get("alias")} for z in (d.get("fields") or [])][:40],"extent":d.get("extent"),"error":d.get("error")},ensure_ascii=False),flush=True)
            else:
             ff=d.get("features") or []
             print("QUERY_MATCH",key,json.dumps({"status":info,"results":len(ff),"exceeded":d.get("exceededTransferLimit"),"features":[x.get("attributes") for x in ff[:20]],"error":d.get("error")},ensure_ascii=False)[:4300],flush=True)

          PYCODE
