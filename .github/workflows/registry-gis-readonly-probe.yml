name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch 3 real planning layer previews and alternative export formats
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,urllib.error,json,time,hashlib,concurrent.futures
          ROOT="https://geopau.gov.tn/arcgisserver/rest/services/public/SCANs_public/MapServer"
          layers=[("Beni_Khaled",157,"1177017.1273561327,4387922.946581527,1181475.2784676866,4392480.682813505"),("Kelibia",155701,"1231537.198557113,4414818.82725413,1239666.2794378162,4420732.781789059"),("Korba",168,"1203144.4246317514,4377336.907738615,1211767.2212635144,4384175.633278661")]
          def probe(name,url,timeout=25):
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"*/*"}),timeout=timeout) as r:
             raw=r.read(1000000);ctype=r.headers.get("Content-Type");st=r.status;end=r.url
            rec={"name":name,"status":st,"type":ctype,"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()[:14],"url":end[:320]}
            if "json" in str(ctype) or raw.startswith(b"{"):rec["response"]=raw[:550].decode("utf8","replace")
            elif "text" in str(ctype):rec["response"]=raw[:150].decode("utf8","replace")
            elif raw.startswith(bytes.fromhex("89504e47")):rec["media"]="PNG"
            elif raw.startswith(bytes.fromhex("ffd8ff")):rec["media"]="JPEG"
            return rec
           except Exception as e:return {"name":name,"error":type(e).__name__+":"+str(e)[:120]}
          work=[]
          for name,lid,bbox in layers:
           work.append((name+"_thumbnail",f"{ROOT}/{lid}/thumbnail"))
           work.append((name+"_iteminfo",f"{ROOT}/{lid}/iteminfo?f=json"))
           p={"bbox":bbox,"bboxSR":3857,"imageSR":3857,"size":"250,250","format":"png24","layers":"show:"+str(lid),"f":"image"}
           work.append((name+"_export_image",ROOT+"/export?"+urllib.parse.urlencode(p)))
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
           for a in ex.map(lambda x:probe(*x),work):print("PLAN_PROBE",json.dumps(a,ensure_ascii=False),flush=True)

          PYCODE
