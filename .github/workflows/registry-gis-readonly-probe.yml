name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public WCS/WMS capabilities and renderer response
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,urllib.error,time,re,concurrent.futures
          root="https://geopau.gov.tn/arcgisserver"
          S=[
          ("wcs_rest",root+"/rest/services/public/SCANs_public/MapServer/WCSServer?service=WCS&request=GetCapabilities&version=1.0.0"),
          ("wcs_services",root+"/services/public/SCANs_public/MapServer/WCSServer?service=WCS&request=GetCapabilities&version=1.0.0"),
          ("wms_services",root+"/services/public/SCANs_public/MapServer/WMSServer?service=WMS&request=GetCapabilities&version=1.3.0"),
          ("render_base",root+"/rest/services/public/SCANs_public/MapServer/export?"+urllib.parse.urlencode({"bbox":"1177017,4387922,1181475,4392480","bboxSR":102100,"imageSR":102100,"size":"200,200","format":"png","f":"json"}))
          ]
          def run(i):
           n,u=i;t=time.monotonic()
           try:
            with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Accept":"*/*"}),timeout=30) as r:
             data=r.read(350000);st=r.status;ctype=r.headers.get("Content-Type");final=r.url
            s=data.decode("utf8","replace");title=re.search(r'<title[^>]*>(.*?)</title>',s,re.S|re.I); err=re.findall(r'(?i)(?:error|fault|exception)[^\n<]{0,150}',s)
            print("ALTERNATE",n,"status",st,"type",ctype,"bytes",len(data),"title",title.group(1)[:90] if title else "", "errors",err[:3],"start",s[:140],"url",final[:190],"seconds",round(time.monotonic()-t,1),flush=True)
           except Exception as e:print("ALTERNATE_ERROR",n,type(e).__name__,str(e)[:160],flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:list(ex.map(run,S))

          PYCODE
