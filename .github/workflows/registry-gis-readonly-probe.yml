name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check 8 real lot polygon intersections and distinguish duplicated geometry
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,json,time,os,math
          os.makedirs("geopau_lot_join_quality",exist_ok=True)
          base="https://services1.arcgis.com/zcZDLWCe77bUzzw7/arcgis/rest/services/Map_DarChaabane/FeatureServer"
          def query(layer,p):
           u=base+"/"+str(layer)+"/query?"+urllib.parse.urlencode(p)
           with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 (read-only GIS independent geometry validity audit)"}),timeout=17) as r:return json.load(r)
          counts={}
          for where in ["ttr_fcier IS NOT NULL AND ttr_fcier <> ' '","Titre_Foncier IS NOT NULL","Type_Zone IS NOT NULL"]:
           layer=11 if where.startswith("Type_Zone") else 13
           try:counts[where]=query(layer,{"where":where,"returnCountOnly":"true","f":"json"}).get("count")
           except Exception as e:counts[where+"_error"]=str(e)[:100]
          sample=query(13,{"where":"1=1","outFields":"OBJECTID,Titre_Foncier,ttr_fcier","returnGeometry":"true","outSR":"4326","orderByFields":"OBJECTID ASC","resultRecordCount":"30","f":"json"})
          feats=sample.get("features",[])
          print("SAMPLED_LOTS",len(feats),"first_ids",[f["attributes"].get("OBJECTID") for f in feats[:20]],flush=True)
          def canonical(g):
           return json.dumps(g.get("rings"),sort_keys=True,separators=(",",":")) if g else ""
          records=[]
          for ix in [0,2,5,10,15,20,25,29]:
           if ix>=len(feats):continue
           f=feats[ix];geom=f.get("geometry") or {}
           if not geom.get("rings"):continue
           try:
            zones=query(11,{"where":"1=1","geometry":json.dumps({"rings":geom["rings"],"spatialReference":{"wkid":4326}},separators=(",",":")),"geometryType":"esriGeometryPolygon","inSR":"4326","spatialRel":"esriSpatialRelIntersects","outFields":"OBJECTID,Type_Zone","returnGeometry":"true","outSR":"4326","f":"json"})
            zz=zones.get("features",[])
            rec={"lot_oid":f["attributes"].get("OBJECTID"),"zones_count":len(zz),"zone_labels":[z["attributes"].get("Type_Zone") for z in zz[:10]],"zone_objectids":[z["attributes"].get("OBJECTID") for z in zz[:10]],"geometry_exact_match":any(canonical(z.get("geometry"))==canonical(geom) for z in zz)}
            records.append(rec)
            print("JOIN",json.dumps(rec,ensure_ascii=False),flush=True)
           except Exception as e:print("JOIN_ERROR",f["attributes"].get("OBJECTID"),type(e).__name__,str(e)[:150],flush=True)
          result={"sampled_lots":len(feats),"tests":records,"counts":counts}
          with open("geopau_lot_join_quality/results.json","w",encoding="utf8") as w:json.dump(result,w,ensure_ascii=False,indent=2)
          print("FINAL",json.dumps(result,ensure_ascii=False)[:7000],flush=True)

          PYCODE
      - name: Save geometry join quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: geopau-darchaabane-eight-lot-geometry-join-quality
          path: geopau_lot_join_quality/
          retention-days: 7
