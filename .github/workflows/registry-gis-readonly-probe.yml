name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check exact user-supplied map service and raster layer 166 routes
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,urllib.error,json,time,concurrent.futures,hashlib
          base="https://geopau.gov.tn/arcgisserver/rest/services/public/SCANs_public/MapServer"
          endpoints=[
           ("root_query",base+"/query",{"where":"1=1","outFields":"*","f":"json"}),
           ("layer_166_query",base+"/166/query",{"where":"1=1","outFields":"*","returnGeometry":"true","f":"json"}),
           ("layer_166_metadata",base+"/166",{"f":"pjson"}),
           ("export_166_small",base+"/export",{"bbox":"1234049.300467637,4418990.733423825,1240853.2223591008,4426690.888020831","bboxSR":"3857","imageSR":"3857","size":"480,480","dpi":"96","layers":"show:166","format":"png32","transparent":"true","f":"json"}),
          ]
          def probe(i):
           tag,url,params=i
           u=url+"?"+urllib.parse.urlencode(params)
           start=time.monotonic()
           try:
            with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"}),timeout=17) as r:
             body=r.read(16000); status=r.status; ctype=r.headers.get("Content-Type")
            try:
             j=json.loads(body)
             output={"error":j.get("error"),"result_keys":list(j.keys())[:15],"layers":len(j.get("layers",[])) if isinstance(j.get("layers"),list) else None,"features":len(j.get("features",[])) if isinstance(j.get("features"),list) else None,"image_href":j.get("href"),"type":j.get("type"),"fields":j.get("fields")}
            except Exception:output={"snippet":body[:400].decode("utf8","replace")}
            print("PROBE",json.dumps({"tag":tag,"status":status,"content_type":ctype,"duration":round(time.monotonic()-start,2),"payload":output},ensure_ascii=False)[:2700],flush=True)
           except urllib.error.HTTPError as e:
            print("PROBE",json.dumps({"tag":tag,"status":e.code,"body":e.read(650).decode("utf8","replace"),"duration":round(time.monotonic()-start,2)},ensure_ascii=False),flush=True)
           except Exception as e:print("PROBE",json.dumps({"tag":tag,"error":type(e).__name__,"message":str(e)[:120],"duration":round(time.monotonic()-start,2)},ensure_ascii=False),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:list(ex.map(probe,endpoints))

          PYCODE
