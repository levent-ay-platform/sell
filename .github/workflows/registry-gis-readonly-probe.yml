name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download open OCHA Tunisian administrative polygons and isolate Hammamet sectors
        run: |
          python3 - <<'PYCODE'
          import urllib.request,json,zipfile,io
          u="https://www.data4tunisia.org/api/1/datasets/r/ebe19593-9438-4d14-8291-e65f811e2671"
          with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"MalakPublicGeodataResearch/1.0"}),timeout=75) as r:data=r.read(65000000)
          print("DATASET_DOWNLOAD",len(data),flush=True)
          z=zipfile.ZipFile(io.BytesIO(data))
          for f in ["tun_admin4.geojson","tun_admin3.geojson"]:
           d=json.loads(z.read(f));matches=[]
           for feat in d.get("features",[]):
            p=feat.get("properties") or {}
            if p.get("adm3_pcode")=="TN1566" or p.get("adm3_pcode")=="TN1566" and f.endswith("3.geojson"):
             matches.append({"name":p.get("adm4_name") or p.get("adm3_name"),"arabic":p.get("adm4_name1") or p.get("adm3_name1"),"pcode":p.get("adm4_pcode") or p.get("adm3_pcode"),"parent":p.get("adm3_name"),"area_sqkm":p.get("area_sqkm"),"center_lat":p.get("center_lat"),"center_lon":p.get("center_lon"),"geom_type":(feat.get("geometry") or {}).get("type")})
           print("HAMMAMET_ADMIN_FEATURES",f,json.dumps(matches,ensure_ascii=False),flush=True)
           if f=="tun_admin4.geojson":
            wanted=[feat for feat in d["features"] if (feat.get("properties") or {}).get("adm3_pcode")=="TN1566"]
            output={"type":"FeatureCollection","name":"Hammamet sector boundaries — OCHA 2022, not land parcel","features":wanted}
            with open("hammamet_admin4.geojson","w",encoding="utf8") as o:json.dump(output,o,ensure_ascii=False)

          PYCODE
      - name: Publish Hammamet sector polygons research artifact
        uses: actions/upload-artifact@v4
        with:
          name: hammamet-open-admin4-geojson
          path: hammamet_admin4.geojson
          retention-days: 7
