name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify AFH land maps, cadastral alternatives, Nabeul blocks and genuine parcel features
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,json,time,os,concurrent.futures
          os.makedirs("gis_focused_source_verification",exist_ok=True)
          ORG="zcZDLWCe77bUzzw7"
          S="https://services1.arcgis.com/"+ORG+"/arcgis/rest/services"
          P="https://www.arcgis.com/sharing/rest/"
          def req(url,timeout=18):
           with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (Malak GIS public read-only search)","Accept":"application/json"}),timeout=timeout) as r:return json.load(r)
          maps=[
           ("AFH_Foncier","423773a3de374791b47f2e31b5ff61fa"),
           ("AFI_Zones","c43c6b315b14483caba3d913a5ddc134"),
           ("SNITCadastre_Map","cd416e5432c64fe69ce451bc997f31af"),
           ("Cadastre_Map","ba422be89b954fb1a97e81eb15b0d5d4"),
           ("Nabeul_Archeo",""), 
          ]
          for label,id in maps:
           if not id:continue
           try:
            j=req(P+"content/items/"+id+"/data?f=json")
            layers=[]
            for x in j.get("operationalLayers",[]):
             layers.append({"title":x.get("title"),"id":x.get("id"),"type":x.get("layerType"),"url":x.get("url"),"n":len(x.get("layers",[]))})
            print("MAP",json.dumps({"label":label,"itemId":id,"error":j.get("error"),"layers":layers,"baseMap":str(j.get("baseMap",{}).get("title"))[:80]},ensure_ascii=False)[:9500],flush=True)
            with open("gis_focused_source_verification/"+label+"_webmap.json","w",encoding="utf8") as o:json.dump(j,o,ensure_ascii=False,indent=2)
           except Exception as e:print("MAP_ERR",label,type(e).__name__,str(e)[:120],flush=True)
          slugs=[
           ("ilot_4326",10),
           ("7ccef08f511740fc92ce9763afb32d66_view_1589283511312",5),
           ("c0bd8d559041438eb06f9e08761d9052_view_1588678607727",5),
           ("0f6dacfdb821449582f6f0472016b241_view_1565793602360",5),
           ("ZONES_IND",0),
           ("Monuments_sites_archeologiques_Nabeul_2019",0),
           ("Projet_Municipalité_Raoued",4)]
          def inspect(x):
           name,id=x
           b=S+"/"+urllib.parse.quote(name)+"/FeatureServer/"+str(id)
           t=time.monotonic();r={"service":name,"layer_id":id,"url":b}
           try:
            m=req(b+"?f=json")
            r.update({"error":m.get("error"),"name":m.get("name"),"geometry":m.get("geometryType"),"extent":m.get("extent"),"fields":[{"name":v.get("name"),"type":v.get("type")} for v in m.get("fields",[])],"description":str(m.get("description",""))[:150]})
            if not m.get("error"):
             q=req(b+"/query?"+urllib.parse.urlencode({"where":"1=1","returnCountOnly":"true","f":"json"}))
             r["count"]=q.get("count");r["count_error"]=q.get("error")
             if isinstance(q.get("count"),int) and q["count"]>0:
              oid=m.get("objectIdField","OBJECTID")
              j=req(b+"/query?"+urllib.parse.urlencode({"where":"1=1","outFields":oid,"returnGeometry":"true","outSR":"4326","resultRecordCount":"1","f":"json"}))
              v=(j.get("features") or [{}])[0];g=v.get("geometry") or {}
              r["sample_geometry_verified"]=bool(g.get("rings") or g.get("x") is not None or g.get("paths"))
              r["geometry_type"]=list(g)[:4];r["sample_error"]=j.get("error")
           except Exception as e:r["request_error"]=type(e).__name__+":"+str(e)[:120]
           r["elapsed"]=round(time.monotonic()-t,1)
           print("VECTOR",json.dumps(r,ensure_ascii=False)[:6500],flush=True)
           return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as p:vectors=list(p.map(inspect,slugs))
          with open("gis_focused_source_verification/candidate_layers.json","w",encoding="utf8") as o:json.dump(vectors,o,ensure_ascii=False,indent=2)
          queries=[
           ("org_hammamet","orgid:"+ORG+" AND (Hammamet OR Nabeul OR Kelibia OR Kélibia)"),
           ("org_cadastre","orgid:"+ORG+" AND (cadastre OR parcel OR parcelle OR foncier OR lotissement)"),
           ("org_afh","orgid:"+ORG+" AND (AFH OR AFI OR AFT OR ilot OR îlot)")]
          for label,phrase in queries:
           try:
            j=req(P+"search?"+urllib.parse.urlencode({"q":phrase,"num":"100","f":"json"}))
            res=[{"title":v.get("title"),"id":v.get("id"),"type":v.get("type"),"url":v.get("url"),"owner":v.get("owner")} for v in j.get("results",[])]
            print("ORG_QUERY",json.dumps({"label":label,"total":j.get("total"),"results":res[:90]},ensure_ascii=False)[:9800],flush=True)
            with open("gis_focused_source_verification/"+label+"_search.json","w",encoding="utf8") as o:json.dump({"total":j.get("total"),"results":res},o,ensure_ascii=False,indent=2)
           except Exception as e:print("ORG_QUERY_ERR",label,type(e).__name__,str(e)[:130],flush=True)

          PYCODE
      - name: Archive scoped verified ArcGIS datasets
        uses: actions/upload-artifact@v4
        with:
          name: malak-gis-targeted-afh-parcel-verification
          path: gis_focused_source_verification/
          retention-days: 7
