name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Analyze OTC public route and ArcGIS fields via bounded GET
        run: |
          python3 - <<'PYCODE'
          import urllib.request, urllib.parse, urllib.error, json, hashlib, re, ssl, time
          from html.parser import HTMLParser
          BASE="https://geopau.gov.tn/arcgisserver/rest/services/public"
          urls={
           "otc_renseignements":"https://www.otc.nat.tn/Renseignements",
           "otc_home":"https://www.otc.nat.tn/",
           "otc_products":"https://www.otc.nat.tn/products",
           "pau_layers":BASE+"/PAUs_public/MapServer/layers?f=json",
           "scan_layers":BASE+"/SCANs_public/MapServer/layers?f=json",
           "query_equip_id524":BASE+"/PAUs_public/MapServer/137/query?"+urllib.parse.urlencode({"where":"OBJECTID=524","outFields":"OBJECTID,PAU_ID,Theme_ID","returnGeometry":"false","f":"json"}),
           "query_equip_count":BASE+"/PAUs_public/MapServer/137/query?"+urllib.parse.urlencode({"where":"1=1","returnCountOnly":"true","f":"json"}),
           "find_555941_layer66":BASE+"/PAUs_public/MapServer/find?"+urllib.parse.urlencode({"searchText":"555941","contains":"false","layers":"66","returnGeometry":"false","f":"json"})
          }
          class Page(HTMLParser):
           def __init__(self):super().__init__();self.title=False;self.titleText=[];self.forms=[];self.scripts=[];self.links=[];self.hints=[]
           def handle_starttag(self,tag,attrs):
            d=dict(attrs)
            if tag=="title":self.title=True
            if tag=="form":self.forms.append({"method":d.get("method"),"action":d.get("action")})
            if tag=="script" and d.get("src"):self.scripts.append(d["src"])
            if tag=="a" and d.get("href"):self.links.append(d["href"])
           def handle_endtag(self,tag):
            if tag=="title":self.title=False
           def handle_data(self,d):
            if self.title:self.titleText.append(d)
          for key,url in urls.items():
           t=time.monotonic()
           try:
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; MalakGISReadOnly/1.0)"})
            with urllib.request.urlopen(req,timeout=15) as r:
             payload=r.read(3_000_000)
             code=r.status; ctype=r.headers.get("Content-Type"); final=r.url
            print("FETCH",key,"status",code,"type",ctype,"bytes",len(payload),"seconds",round(time.monotonic()-t,1),"final_path",urllib.parse.urlsplit(final).path,flush=True)
            if key.startswith("otc"):
             html=payload.decode("utf8","replace"); p=Page();p.feed(html)
             print("OTC_PAGE",key,"sha256",hashlib.sha256(payload).hexdigest()[:16],"title","".join(p.titleText)[:130],"forms",p.forms[:8],"script_paths",p.scripts[-12:],"candidate_links",[x[:150] for x in p.links if re.search("renseign|api|cadast|geo|plan|product|cart|service|map",x,re.I)][:35],flush=True)
             print("OTC_MARKERS",key,{w:html.lower().count(w) for w in ["renseignements","copie de plan","geoportail","api/","iframe","404","not found"]},flush=True)
            else:
             d=json.loads(payload.decode("utf8","replace"))
             if key.endswith("layers"):
              layers=d.get("layers") or []
              hits=[]
              for l in layers:
               fn=[x.get("name","") for x in (l.get("fields") or []) if isinstance(x,dict)]
               name=l.get("name","")
               words=[w for w in fn if re.search("cadast|foncier|titre|parcell|matric|immatric|num.?tf|n.?titre|no.?titre|lot|reference|registre",w,re.I)]
               if words or re.search("cadast|foncier|parcell|matric",name,re.I):hits.append({"id":l.get("id"),"name":name,"matched_fields":words[:20]})
              print("GIS_LAYERS",key,"count",len(layers),"matched_layers",hits[:80],flush=True)
             else:print("GIS_QUERY",key,"error",d.get("error"),"count",d.get("count"),"results_count",len(d.get("results",[])),"features_count",len(d.get("features",[])),"first_properties",[(x.get("attributes") or {}) for x in d.get("features",[])[:2]],flush=True)
           except Exception as e:print("FETCH_ERROR",key,type(e).__name__,str(e)[:150],flush=True)

          PYCODE
