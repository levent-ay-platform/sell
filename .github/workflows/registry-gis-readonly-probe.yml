name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Identify the three active map services and search widget endpoints
        run: |
          python3 - <<'PYCODE'
          import urllib.request,json
          root="https://geopau.gov.tn/app_sig_pau_tunisie_public/"
          def get(url):
           with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=25) as r:return json.load(r)
          app=get(root+"config.json")
          portal=app["map"]["portalUrl"]
          m=get(portal+"/sharing/rest/content/items/"+app["map"]["itemId"]+"/data?f=json")
          for layer in m.get("operationalLayers",[]):
           print("OPERATIONAL",json.dumps({"title":layer.get("title"),"id":layer.get("id"),"url":layer.get("url"),"visibility":layer.get("visibility"),"layerType":layer.get("layerType"),"visibleLayers":layer.get("visibleLayers",[])[:15],"layer_count":len(layer.get("layers",[]))},ensure_ascii=False),flush=True)
          for section in ("widgetOnScreen","widgetPool"):
           for w in (app.get(section) or {}).get("widgets",[]):
            if any(t in str(w.get("uri")).lower() for t in ("esearch","search","layerlist")):
             path=w.get("config")
             if isinstance(path,str) and path.endswith(".json"):
              try:
               data=get(root+path)
               refs=[]
               def find(x,k=""):
                if isinstance(x,dict):
                 for key,value in x.items():find(value,key)
                elif isinstance(x,list):
                 for value in x:find(value,k)
                elif isinstance(x,str) and ("MapServer" in x or "FeatureServer" in x):refs.append({"field":k,"url":x[:230]})
               find(data)
               print("WIDGET",json.dumps({"name":w.get("uri"),"config_path":path,"keys":list(data)[:20],"GIS_URLS":refs[:20]},ensure_ascii=False)[:4500],flush=True)
              except Exception as e:print("WIDGET_ERR",path,str(e)[:150],flush=True)

          PYCODE
