name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Search public ArcGIS catalogue for cadastral parcel layers
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,json,time
          terms=[
           'cadastre Tunisie','parcel cadastral Tunisia','parcelle nabeul','titre foncier Hammamet','foncier Tunisie'
          ]
          for query in terms:
           url='https://www.arcgis.com/sharing/rest/search?'+urllib.parse.urlencode({'q':query,'f':'json','num':20,'sortField':'score'})
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MalakGISResearch/1.0'}),timeout=9) as r:data=json.loads(r.read(350000))
            results=[{'title':x.get('title'),'type':x.get('type'),'owner':x.get('owner'),'id':x.get('id'),'url':x.get('url')} for x in data.get('results',[]) if any(w in (str(x.get('title',''))+' '+str(x.get('description',''))).lower() for w in ['cadast','parcell','foncier','hammamet','tunisie','tunisia','nabeul'])]
            print('ARCGIS_SEARCH',query,'total',data.get('total'),'relevant',json.dumps(results[:12],ensure_ascii=False),flush=True)
           except Exception as e:print('ARCGIS_SEARCH_ERROR',query,type(e).__name__,str(e)[:95],flush=True)

          PYCODE
