name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover public AFH land GIS server and related public real estate map sources
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,urllib.error,json,re,time,concurrent.futures,os
          os.makedirs("graphtech_afh_source_audit",exist_ok=True)
          root="https://arcgis.graphtech-gis.com/server/rest/services"
          targets=[
          ("graphtech_services_root",root+"?f=json"),
          ("AFH_Demo_root",root+"/AFH/AFH_Demo/MapServer?f=json"),
          ("AFH_Demo_layers",root+"/AFH/AFH_Demo/MapServer/layers?f=json"),
          ("AFH_folder",root+"/AFH?f=json"),
          ("Hammamet_webmap","https://www.arcgis.com/sharing/rest/content/items/38e44ebd99504e728e060c23c9931268/data?f=json"),
          ("SIF_MDEAF_home","https://www.graphtech-gis.com/MDEAF/"),
          ]
          def fetch(q):
           label,url=q;t=time.monotonic();res={"label":label,"url":url}
           try:
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (public ArcGIS atlas research, read only)","Accept":"application/json,text/html,*/*;q=0.3"})
            with urllib.request.urlopen(req,timeout=21) as r:
             b=r.read(1200000)
             res.update({"http":r.status,"type":r.headers.get("content-type"),"byte_count":len(b),"final_url":r.url})
            try:
             j=json.loads(b)
             res["json_error"]=j.get("error")
             if "folders" in j:res["folders"]=j["folders"]
             if "services" in j:res["services"]=[{"name":x.get("name"),"type":x.get("type")} for x in j["services"]]
             if "layers" in j:res["layers"]=[{"id":x.get("id"),"name":x.get("name"),"type":x.get("type"),"geometryType":x.get("geometryType"),"fields":[f.get("name") for f in x.get("fields",[])]} for x in j["layers"]][:100]
             if "operationalLayers" in j:res["operationalLayers"]=[{"title":x.get("title"),"url":x.get("url"),"type":x.get("layerType")} for x in j["operationalLayers"]][:30]
             res["description"]=(j.get("description") or j.get("serviceDescription") or "")[:160]
             if not j.get("error") and (j.get("layers") is not None or j.get("folders") is not None or j.get("services") is not None):
              with open("graphtech_afh_source_audit/"+label+".json","w",encoding="utf8") as o:json.dump(j,o,ensure_ascii=False,indent=2)
            except Exception:
             s=b.decode("utf8","replace")
             res["title"]=re.findall("<title[^>]*>(.*?)</title>",s,re.I|re.S)[:2]
             res["snippet"]=s[:180]
             res["arcgis_refs"]=re.findall(r'https?://[^"\'<> ]+(?:MapServer|FeatureServer)',s)[:12]
           except urllib.error.HTTPError as e:
            res["http"]=e.code;res["body"]=e.read(120).decode("utf8","replace")
           except Exception as e:res["error"]=type(e).__name__+":"+str(e)[:120]
           res["time"]=round(time.monotonic()-t,1)
           print("SITE",json.dumps(res,ensure_ascii=False)[:12500],flush=True)
           return res
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as p:allres=list(p.map(fetch,targets))
          # Validate specific published cadastral text field richness without reading names/personal info
          urls=[
           ("Raoued_approved_lots","https://services1.arcgis.com/zcZDLWCe77bUzzw7/arcgis/rest/services/Projet_Municipalit%C3%A9_Raoued/FeatureServer/4/query", "TFN_رسم"),
          ]
          for label,url,field in urls:
           for suffix,where in (("not_null",field+" IS NOT NULL"),("nonblank",field+" IS NOT NULL AND "+field+" <> ' '"),("target_555941",field+"='555941'")):
            q=url+"?"+urllib.parse.urlencode({"where":where,"returnCountOnly":"true","f":"json"})
            t=time.monotonic()
            try:
             with urllib.request.urlopen(urllib.request.Request(q,headers={"User-Agent":"Mozilla/5.0"}),timeout=12) as r:j=json.load(r)
             print("ATTRIBUTE_AUDIT",json.dumps({"service":label,"field":field,"test":suffix,"count":j.get("count"),"error":j.get("error"),"secs":round(time.monotonic()-t,2)},ensure_ascii=False),flush=True)
            except Exception as e:print("ATTRIBUTE_ERROR",label,suffix,type(e).__name__,str(e)[:120],flush=True)
          with open("graphtech_afh_source_audit/result_summary.json","w",encoding="utf8") as o:json.dump(allres,o,ensure_ascii=False,indent=2)

          PYCODE
      - name: Archive public AFH / Hammamet source descriptions
        uses: actions/upload-artifact@v4
        with:
          name: malak-afh-land-map-live-service-verification
          path: graphtech_afh_source_audit/
          retention-days: 7
