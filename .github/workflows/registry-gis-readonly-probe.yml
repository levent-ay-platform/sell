name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect COMPLETE OTC public pages and actual outbound GIS links
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,html.parser,re,collections,json,concurrent.futures,time
          BASE="https://www.otc.nat.tn"
          PAGES=["/products","/docs","/geoportail","/tlis"]
          class P(html.parser.HTMLParser):
           def __init__(self):super().__init__();self.links=[];self.scripts=[];self.forms=[];self.depth=0
           def handle_starttag(self,t,attrs):
            a=dict(attrs)
            if t=="script":
             if a.get("src"):self.scripts.append(urllib.parse.urljoin(BASE,a["src"]))
            if t=="a":
             v=a.get("href")
             if v:self.links.append(v)
            if t=="form":self.forms.append({"method":a.get("method"),"action":a.get("action")})
          def get(path):
           t=time.monotonic()
           try:
            with urllib.request.urlopen(urllib.request.Request(BASE+path,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html"}),timeout=17) as r:
             raw=r.read(1100000);ct=r.headers.get("Content-Type");cl=r.headers.get("Content-Length")
            s=raw.decode("utf8","replace");p=P();p.feed(s)
            def relevant(v):return bool(re.search(r"(api|wms|wfs|geo|plan|parc|cadas|fonc|renseign|archives?|carts|documents?|otc)",v,re.I))
            refs=list(dict.fromkeys(p.links))
            scripts=list(dict.fromkeys(p.scripts))
            match=list(dict.fromkeys(re.findall(r'(?:/|https?://)[^\s\"\'<>]{0,120}(?:api|geoportail|cadas|foncier|parcelle|renseignement|/carts/)[^\s\"\'<>]{0,120}',s,re.I)))[:30]
            print("PUBLIC_PAGE",json.dumps({"path":path,"duration":round(time.monotonic()-t,1),"bytes":len(raw),"content_length":cl,"type":ct,"title":re.findall(r'<title[^>]*>(.*?)</title>',s,re.I|re.S)[:1],"scripts":scripts[:22],"relevant_a_href":[v for v in refs if relevant(v)][:45],"forms":p.forms,"references":match,"html_ends":s[-80:]},ensure_ascii=False),flush=True)
           except Exception as e:print("PUBLIC_PAGE_ERR",path,type(e).__name__,str(e)[:120],flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:list(ex.map(get,PAGES))

          PYCODE
