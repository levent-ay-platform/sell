name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Audit names and joins in vector PAU plus administrative GIS
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,urllib.error,json,re,time,concurrent.futures
          base="https://geopau.gov.tn/arcgisserver/rest/services/public"
          urls={"PAU_ALL_LAYERS":base+"/PAUs_public/MapServer/layers?f=json",
                "LIM_ADMIN_SERVICE":base+"/LimitesAdmin/MapServer?f=json",
                "LIM_ADMIN_LAYERS":base+"/LimitesAdmin/MapServer/layers?f=json",
                "PAU_LAYER_69":base+"/PAUs_public/MapServer/69?f=json",
                "PAU_LAYER_70":base+"/PAUs_public/MapServer/70?f=json",
                "PAU_LAYER_0":base+"/PAUs_public/MapServer/0?f=json",
                "PAU_LAYER_66":base+"/PAUs_public/MapServer/66?f=json"}
          def fetch(item):
           key,url=item;st=time.monotonic()
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 MalakGISFieldAudit/1.0"}),timeout=36) as r:
             raw=r.read(1600000);typ=r.headers.get("Content-Type")
            try: data=json.loads(raw)
            except: data={"_raw":raw[:120].decode("utf8","replace")}
            return key,data,{"bytes":len(raw),"type":typ,"duration":round(time.monotonic()-st,1)}
           except Exception as e:return key,{},{"error":type(e).__name__+" "+str(e)[:150],"duration":round(time.monotonic()-st,1)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
           for key,data,info in ex.map(fetch,urls.items()):
            if data.get("error"): info["error"]=data["error"]
            print("META_CHECK",key,json.dumps(info,ensure_ascii=False),flush=True)
            if key=="PAU_ALL_LAYERS":
             ls=data.get("layers",[])
             print("LAYER_COUNT",len(ls),flush=True)
             for l in ls:
              fields=l.get("fields") or []
              field_names=[str(f.get("name","")) for f in fields]
              idx=[n for n in field_names if re.search(r"(pau|nom|name|lieu|comm|gouv|deleg|imad|secteur|zone|lot|local|ville|admin|intitul|code|nature|type|urban|fonc|parc|titr)",n,re.I)]
              aliases=[str(f.get("alias","")) for f in fields if re.search(r"(pau|nom|name|lieu|comm|gouv|deleg|imad|secteur|zone|lot|local|ville|admin|intitul|code|nature|type|urban|fonc|parc|titr)",str(f.get("alias","")),re.I)]
              if idx or (not l.get("subLayers") and re.search(r"(limit|pau|ville|gouv|lotiss|zone|contour|comm)",l.get("name",""),re.I)):
               print("LAYER_FIELDS",l.get("id"),l.get("name"),"geometry",l.get("geometryType"),"fields",json.dumps(idx[:22],ensure_ascii=False),"aliases",json.dumps(aliases[:10],ensure_ascii=False),flush=True)
            elif key=="LIM_ADMIN_LAYERS":
             ls=data.get("layers",[])
             print("ADMIN_LAYERS",len(ls),flush=True)
             for l in ls[:20]:print("ADMIN_DETAIL",l.get("id"),l.get("name"),"geometry",l.get("geometryType"),"fields",json.dumps([{"n":f.get("name"),"a":f.get("alias")} for f in (l.get("fields") or [])][:28],ensure_ascii=False),flush=True)
            elif key=="LIM_ADMIN_SERVICE":
             print("ADMIN_SERVICE",json.dumps({"mapName":data.get("mapName"),"layers":data.get("layers"),"tables":data.get("tables"),"error":data.get("error")},ensure_ascii=False)[:2500],flush=True)
            else:
             print("LAYER_DETAIL",key,json.dumps({"id":data.get("id"),"name":data.get("name"),"type":data.get("type"),"geometryType":data.get("geometryType"),"fields":[{"n":x.get("name"),"a":x.get("alias")} for x in (data.get("fields") or [])][:35],"subLayers":data.get("subLayers"),"extent":data.get("extent"),"error":data.get("error")},ensure_ascii=False)[:3500],flush=True)

          PYCODE
