name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Nabeul raster group and bounded map export (public GET)
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,urllib.error,json,math,time
          base="https://geopau.gov.tn/arcgisserver/rest/services/public/SCANs_public/MapServer"
          urls={
          "nabeul_group":base+"/176?f=json",
          "beni_khaled":base+"/157?f=json",
          "kelibia":base+"/155701?f=json",
          "beni_khaled_export":base+"/export?"+urllib.parse.urlencode({"bbox":"1177017.1273561327,4387922.946581527,1181475.2784676866,4392480.682813505","bboxSR":3857,"imageSR":3857,"layers":"show:157","size":"850,850","format":"png32","transparent":"false","f":"json"})
          }
          for label,u in urls.items():
           st=time.monotonic()
           try:
            with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"MalakPublicGISResearch/1.0"}),timeout=18) as r:
             raw=r.read(300000);typ=r.headers.get("Content-Type")
            print("RESPONSE",label,typ,len(raw),"secs",round(time.monotonic()-st,1),flush=True)
            d=json.loads(raw)
            if "error" in d: print("ARC_ERROR",label,d["error"],flush=True)
            elif label=="beni_khaled_export":
             print("MAP_EXPORT",{"href":d.get("href"),"width":d.get("width"),"height":d.get("height"),"extent":d.get("extent")},flush=True)
            else:
             x=d.get("extent") or {}
             coords=None
             if x and x.get("spatialReference",{}).get("wkid") in (3857,102100):
              coords=[round(v,5) for v in [x["xmin"]/6378137*180/math.pi,(2*math.atan(math.exp(x["ymin"]/6378137))-math.pi/2)*180/math.pi,x["xmax"]/6378137*180/math.pi,(2*math.atan(math.exp(x["ymax"]/6378137))-math.pi/2)*180/math.pi]]
             print("LAYER",label,{"id":d.get("id"),"name":d.get("name"),"type":d.get("type"),"geometryType":d.get("geometryType"),"child_ids":d.get("subLayers"),"field_count":len(d.get("fields") or []),"extent_gps_minlon_minlat_maxlon_maxlat":coords},flush=True)
           except Exception as e:print("NETWORK_ERROR",label,type(e).__name__,str(e)[:120],flush=True)

          PYCODE
