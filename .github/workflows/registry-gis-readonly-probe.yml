name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check actual candidate parcel-like vector layers and GIS server service catalog
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,urllib.error,json,time,concurrent.futures,collections
          base="https://geopau.gov.tn/arcgisserver/rest"
          url=base+"/services/public/PAUs_public/MapServer"
          layer_tests=[
          (66,"Lotissement","OBJECTID,Intitule,Lotisseur,Date_Approb,Zone_ID,PAU_ID"),
          (12,"Contour_Reg_Ilots","OBJECTID,PAU_ID"),
          (68,"Limite_PAD","OBJECTID,PAD_ID,PIF"),
          (67,"SDA","OBJECTID,PAU_ID,Date_"),
          (137,"Equipements(Polygones)","OBJECTID,EquipPt_ID,PAU_ID"),
          (69,"Limite_PAU","OBJECTID,PAU_ID,Libelle"),
          (60,"Zones_Codes","OBJECTID,Zone_id,Code,Vocation,PAU_ID"),
          (138,"Zones","OBJECTID,Zone_id,Code,Vocation,PAU_ID"),
          (51,"DPF","OBJECTID,PA_ID,NOM"),
          ]
          def test(item):
           typ,tag,u,form=item
           t=time.monotonic()
           try:
            req=urllib.request.Request(u+(("?"+urllib.parse.urlencode(form)) if form else ""),headers={"Accept":"application/json","User-Agent":"Mozilla/5.0 GeoPAU-Public-Data-Audit"})
            with urllib.request.urlopen(req,timeout=14) as r:
             b=r.read(100000);ct=r.headers.get("Content-Type");status=r.status
            try:
             j=json.loads(b)
             out={"http":status,"type":ct,"error":j.get("error"),"keys":list(j.keys())[:12],"feature_count":len(j.get("features",[])) if isinstance(j.get("features"),list) else None,"sample_keys":list((j.get("features") or [{}])[0].get("attributes",{}).keys()) if j.get("features") else [],"layers_count":len(j.get("services",[])) if isinstance(j.get("services"),list) else None,"services":j.get("services",[])[:18]}
            except Exception:out={"http":status,"type":ct,"snippet":b[:160].decode("utf8","replace")}
            print("RESULT",json.dumps({"check":tag,"kind":typ,"seconds":round(time.monotonic()-t,1),**out},ensure_ascii=False)[:3500],flush=True)
           except urllib.error.HTTPError as e:
            print("RESULT",json.dumps({"check":tag,"kind":typ,"http":e.code,"seconds":round(time.monotonic()-t,1),"body":e.read(180).decode("utf8","replace")},ensure_ascii=False),flush=True)
           except Exception as e:
            print("RESULT",json.dumps({"check":tag,"kind":typ,"error":type(e).__name__,"details":str(e)[:120],"seconds":round(time.monotonic()-t,1)},ensure_ascii=False),flush=True)
          jobs=[]
          for id,name,fields in layer_tests:
           jobs.append(("QUERY",str(id)+" "+name,url+"/"+str(id)+"/query",{"where":"OBJECTID=1","outFields":fields,"returnGeometry":"false","f":"json"}))
          jobs.extend([
          ("DIRECTORY","public_services",base+"/services/public",{"f":"pjson"}),
          ("DIRECTORY","root_services",base+"/services",{"f":"pjson"}),
          ("METADATA","Lotissement_layer66",url+"/66",{"f":"pjson"}),
          ("METADATA","ContourRegIlots_layer12",url+"/12",{"f":"pjson"}),
          ])
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as p:list(p.map(test,jobs))

          PYCODE
