name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check open Tunisia admin-level GeoJSON against certificate toponym
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,urllib.error,json,zipfile,io,re,unicodedata,time,os
          URL="https://www.data4tunisia.org/api/1/datasets/r/ebe19593-9438-4d14-8291-e65f811e2671"
          def norm(s):
           s=str(s or "").lower()
           s="".join(c for c in unicodedata.normalize("NFKD",s) if not unicodedata.combining(c))
           return re.sub(r'[^a-z0-9\u0600-\u06ff]+'," ",s)
          try:
           t=time.monotonic()
           req=urllib.request.Request(URL,headers={"User-Agent":"MalakOpenGeo/1.0 public dataset research"})
           with urllib.request.urlopen(req,timeout=85) as r:
            raw=r.read(80_000_001);print("DOWNLOAD",r.status,len(raw),"type",r.headers.get("content-type"),"seconds",round(time.monotonic()-t,1),flush=True)
           if len(raw)>80000000:raise ValueError("Dataset too large for bounded probe")
           z=zipfile.ZipFile(io.BytesIO(raw))
           names=z.namelist()
           print("ZIP_CONTENTS",json.dumps([{"file":n,"size":z.getinfo(n).file_size} for n in names],ensure_ascii=False),flush=True)
           for fn in names:
            if not fn.lower().endswith((".json",".geojson")):continue
            if z.getinfo(fn).file_size>70000000:continue
            try:
             with z.open(fn) as rd:obj=json.load(rd)
             ff=obj.get("features") or []
             matches=[]
             for feat in ff:
              p=feat.get("properties") or {}
              tnorm=norm(" ".join(str(v) for v in p.values() if isinstance(v,(str,int))))
              if any(k in tnorm for k in ("mrada","ferj","sidi jedidi","sidi djedidi","hammamet","حمامات","فرجان","مرادة","سيدي الجديدي","nabeul")):
               c=feat.get("geometry",{}).get("coordinates",[])
               matches.append({"p":p,"geom_type":feat.get("geometry",{}).get("type"),"geometry_present":bool(c)})
             print("GEOJSON_FILE",fn,"total",len(ff),"matched",len(matches),"SAMPLE_MATCHES",json.dumps(matches[:55],ensure_ascii=False)[:20000],flush=True)
            except Exception as e:print("FILE_ERROR",fn,type(e).__name__,str(e)[:150],flush=True)
          except Exception as e:print("DOWNLOAD_ERROR",type(e).__name__,str(e)[:250],flush=True)

          PYCODE
