name: Registry GIS read-only source diagnostic
on:
  push:
    branches: [research/registry-arcgis-readonly-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read only public ArcGIS Web App config and linked service references
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,json,re,time,concurrent.futures
          root="https://geopau.gov.tn/app_sig_pau_tunisie_public/"
          paths=["config.json","index.html","apps/","configs/","widgets/LayerList/config.json"]
          def fetch(p):
            t=time.monotonic()
            try:
              req=urllib.request.Request(urllib.parse.urljoin(root,p),headers={"User-Agent":"Mozilla/5.0","Accept":"application/json,text/html,*/*"})
              with urllib.request.urlopen(req,timeout=13) as r:
                data=r.read(500000);code=r.status;ctype=r.headers.get("content-type");final=r.url
              x=data.decode("utf8","replace")
              out={"path":p,"status":code,"type":ctype,"bytes":len(data),"final":final,"time":round(time.monotonic()-t,1)}
              try:
                j=json.loads(x)
                out["json_keys"]=list(j.keys())[:20]
                refs=[]
                def walk(v,k=""):
                  if isinstance(v,dict):
                    for key,val in v.items():walk(val,key)
                  elif isinstance(v,list):
                    for val in v:walk(val,k)
                  elif isinstance(v,str) and ("arcgisserver" in v or "MapServer" in v or "FeatureServer" in v):
                    refs.append({"key":k,"url":v[:200]})
                walk(j)
                out["GIS_REFERENCES"]=refs[:55]
              except Exception:
                out["title"]=re.findall(r"<title[^>]*>(.*?)</title>",x,re.I|re.S)[:1]
                out["script_src"]=re.findall(r'<script[^>]+src=[\'"]([^\'"]+)',x,re.I)[:18]
                out["snippet"]=x[:100] if "<html" not in x.lower() else ""
              print("APP",json.dumps(out,ensure_ascii=False)[:12000],flush=True)
            except Exception as e:print("APP_ERROR",p,type(e).__name__,str(e)[:140],"secs",round(time.monotonic()-t,1),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:list(ex.map(fetch,paths))

          PYCODE
